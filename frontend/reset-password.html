<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Scam Detector — Reset Password</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  />

  <!-- Your existing stylesheet -->
  <link rel="stylesheet" href="css/style.css" />

  <style>
    /* ============================================================
       RESET PASSWORD PAGE
       ============================================================ */

    .reset-password-section {
      min-height: calc(100vh - 160px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 60px 20px;
    }

    .reset-password-card {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
    }

    .reset-password-card__icon {
      width: 65px;
      height: 65px;
      margin: 0 auto 20px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: #eef4ff;
      color: #2563eb;

      font-size: 28px;
    }

    .reset-password-card__title {
      text-align: center;
      margin-bottom: 10px;
      font-size: 28px;
    }

    .reset-password-card__description {
      text-align: center;
      color: #666;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .reset-password-form__field {
      margin-bottom: 22px;
    }

    .reset-password-form__label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .reset-password-form__input-wrapper {
      position: relative;
    }

    .reset-password-form__input {
      width: 100%;
      box-sizing: border-box;

      padding: 14px 45px 14px 14px;

      border: 1px solid #dcdcdc;
      border-radius: 10px;

      font-family: inherit;
      font-size: 15px;

      outline: none;

      transition: 0.2s;
    }

    .reset-password-form__input:focus {
      border-color: #2563eb;

      box-shadow:
        0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .reset-password-form__toggle {
      position: absolute;

      right: 12px;
      top: 50%;

      transform: translateY(-50%);

      border: none;
      background: transparent;

      cursor: pointer;

      color: #666;

      font-size: 16px;
    }

    .reset-password-form__submit {
      width: 100%;

      border: none;
      border-radius: 10px;

      padding: 14px;

      background: #2563eb;
      color: #ffffff;

      font-family: inherit;
      font-size: 15px;
      font-weight: 600;

      cursor: pointer;

      transition: 0.2s;
    }

    .reset-password-form__submit:hover {
      background: #1d4ed8;
    }

    .reset-password-form__submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .reset-password-message {
      display: none;

      margin-top: 20px;
      padding: 12px 15px;

      border-radius: 8px;

      font-size: 14px;
      text-align: center;
    }

    .reset-password-message.success {
      display: block;

      background: #ecfdf5;
      color: #047857;
    }

    .reset-password-message.error {
      display: block;

      background: #fef2f2;
      color: #b91c1c;
    }

    @media (max-width: 600px) {

      .reset-password-card {
        padding: 28px 22px;
      }

    }
  </style>
</head>


<body>

  <!-- ============================================================
       NAVIGATION
       ============================================================ -->

  <header class="navbar">

    <nav class="nav-container">

      <a href="index.html" class="nav-logo">

        <i class="fa-solid fa-shield-halved"></i>

        <span>Scam Detector</span>

      </a>


      <ul class="nav-links">

        <li>
          <a href="index.html" class="nav-link">
            Home
          </a>
        </li>

        <li>
          <a href="history.html" class="nav-link">
            History
          </a>
        </li>

        <li>
          <a href="login.html" class="nav-link">
            Login
          </a>
        </li>

        <li>
          <a
            href="register.html"
            class="nav-link nav-link--register"
          >
            Register
          </a>
        </li>

      </ul>


      <button
        class="nav-toggle"
        aria-label="Toggle navigation"
      >

        <i class="fa-solid fa-bars"></i>

      </button>

    </nav>

  </header>


  <!-- ============================================================
       MAIN
       ============================================================ -->

  <main>

    <section class="reset-password-section">

      <div class="reset-password-card">


        <!-- Icon -->

        <div class="reset-password-card__icon">

          <i class="fa-solid fa-lock"></i>

        </div>


        <!-- Title -->

        <h1 class="reset-password-card__title">
          Reset Password
        </h1>


        <!-- Description -->

        <p class="reset-password-card__description">

          Create a new password for your
          Scam Detector account.

        </p>


        <!-- ======================================================
             RESET PASSWORD FORM
             ====================================================== -->

        <form id="resetPasswordForm">


          <!-- New Password -->

          <div class="reset-password-form__field">

            <label
              for="newPasswordInput"
              class="reset-password-form__label"
            >
              New Password
            </label>


            <div class="reset-password-form__input-wrapper">

              <input
                type="password"
                id="newPasswordInput"
                class="reset-password-form__input"
                placeholder="Enter new password"
                autocomplete="new-password"
                required
              />


              <button
                type="button"
                id="toggleNewPassword"
                class="reset-password-form__toggle"
                aria-label="Show password"
              >

                <i class="fa-solid fa-eye"></i>

              </button>

            </div>

          </div>


          <!-- Confirm Password -->

          <div class="reset-password-form__field">

            <label
              for="confirmPasswordInput"
              class="reset-password-form__label"
            >
              Confirm New Password
            </label>


            <div class="reset-password-form__input-wrapper">

              <input
                type="password"
                id="confirmPasswordInput"
                class="reset-password-form__input"
                placeholder="Confirm new password"
                autocomplete="new-password"
                required
              />


              <button
                type="button"
                id="toggleConfirmPassword"
                class="reset-password-form__toggle"
                aria-label="Show password"
              >

                <i class="fa-solid fa-eye"></i>

              </button>

            </div>

          </div>


          <!-- Submit -->

          <button
            type="submit"
            id="resetPasswordBtn"
            class="reset-password-form__submit"
          >

            <i class="fa-solid fa-key"></i>

            Reset Password

          </button>

        </form>


        <!-- Message -->

        <div
          id="resetPasswordMessage"
          class="reset-password-message"
        ></div>

      </div>

    </section>

  </main>


  <!-- ============================================================
       FOOTER
       ============================================================ -->

  <footer class="footer">

    <div class="footer-container">


      <div class="footer-brand">

        <i class="fa-solid fa-shield-halved"></i>

        <span>Scam Detector</span>

      </div>


      <p class="footer-copyright">

        &copy; 2026 Scam Detector. All rights reserved.

      </p>


      <p class="footer-disclaimer">

        Built for educational purposes only.
        Not a substitute for professional
        cybersecurity tools.

      </p>

    </div>

  </footer>


  <!-- ============================================================
       JAVASCRIPT
       ============================================================ -->

  <script src="js/reset-password.js"></script>

</body>

</html>
